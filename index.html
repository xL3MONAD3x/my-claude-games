<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Arcade 3D</title>
<!-- v: snake + jump runner -->
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#2b2250;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fff3d6;--card:#2c2557}}
:root[data-theme="dark"]{--ink:#fff3d6;--card:#2c2557}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:#2b2250;font-family:"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#menu{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;background:linear-gradient(160deg,#7b2ff7,#f107a3);color:#fff;text-align:center}
#menu h1{margin:0;font-size:36px}
#menu p{margin:0;font-size:18px}
#cards{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.card{width:210px;padding:18px;border:4px solid #fff;border-radius:22px;background:var(--card);color:var(--ink);font:inherit;font-size:20px;font-weight:bold;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.card .e{font-size:50px}
.card small{display:block;margin-top:4px;font-size:14px;font-weight:normal}
#hud{z-index:5;position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px;display:flex;gap:10px;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
#back{font:inherit;font-weight:bold;font-size:18px;padding:8px 16px;border-radius:14px;border:3px solid #fff;background:#ff5d73;color:#fff;cursor:pointer}
#msg{background:rgba(0,0,0,.6);color:#fff;padding:8px 14px;border-radius:14px;font-weight:bold;font-size:17px;pointer-events:none}
#msg:empty{display:none}
#pal{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:0 10px}
.sw{width:54px;height:54px;border-radius:50%;border:4px solid #fff;font:inherit;font-size:24px;font-weight:bold;color:#fff;text-shadow:0 1px 3px #000;cursor:pointer}
.sw.on{outline:5px solid #ffd23f;outline-offset:2px}
#pick{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:rgba(43,34,80,.9);color:#fff;text-align:center}
#pick h2{margin:0 0 6px;font-size:26px}
.opt{font:inherit;font-weight:bold;font-size:20px;padding:14px 22px;width:min(100%,330px);border-radius:18px;border:4px solid #fff;background:#ff5d73;color:#fff;cursor:pointer}
#bar{order:-1;flex-basis:100%;max-width:340px;height:24px;border-radius:12px;background:rgba(0,0,0,.4);border:3px solid #fff;position:relative;overflow:hidden}
#fill{height:100%;width:0;background:#4caf50;transition:width .25s}
#bt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:bold;text-shadow:0 1px 2px #000}
.sw small{display:block;font-size:9px;line-height:1}
.sw.done{font-size:20px;line-height:1}
#lvbtn{margin-left:auto;font:inherit;font-weight:bold;font-size:18px;padding:8px 14px;border-radius:14px;border:3px solid #fff;background:#7b2ff7;color:#fff;cursor:pointer;white-space:nowrap}
.lvgrid{display:grid;grid-template-columns:repeat(5,58px);gap:8px;margin-bottom:8px}
.lvb{width:58px;height:58px;border-radius:14px;border:3px solid #fff;background:#5c3d8f;color:#fff;font:inherit;font-weight:bold;font-size:20px;cursor:pointer}
.lvb.on{background:#ffd23f;color:#2b2250}
#rsbtn{font:inherit;font-weight:bold;font-size:18px;padding:8px 12px;border-radius:14px;border:3px solid #fff;background:#444;color:#fff;cursor:pointer}
.lvb small{display:block;font-size:12px;line-height:1}
.lvb.done{background:#2e9e4f}
.lvb.done.on{background:#ffd23f;color:#2b2250}
#pick p{margin:0;font-size:20px}
#pick ol{margin:0 0 8px;padding:0;list-style:none;font-size:22px;font-weight:bold}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="menu"><h1>🎮 Game Arcade 3D</h1><p>Pick a game to play!</p><div id="cards"></div></div>
<div id="pick" hidden></div>
<div id="hud" hidden><button id="back">← Back</button><div id="msg"></div><button id="lvbtn" hidden></button><button id="rsbtn" hidden aria-label="Reset progress">↺</button></div>
<div id="pal"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
function main(){
const say=t=>{const m=$('msg');if(m.textContent!==t)m.textContent=t};
let AC;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
['pointerdown','touchend','click'].forEach(e=>addEventListener(e,audio,true));
function tone(f,t0,d,type,v,f2){const a=audio();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||.25,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const SND={
  pop(){tone(520,0,.09,'sine',.3,200)},
  tick(){tone(900,0,.03,'square',.05)},
  hit(){tone(700,0,.12,'square',.12,1100);tone(320,0,.12,'sine',.25,120)},
  ding(){tone(1175,0,.6,'sine',.25);tone(1760,0,.6,'sine',.14)},
  bad(){tone(190,0,.2,'sawtooth',.1,120)},
  clap(){const a=audio();if(!a)return;for(let i=0;i<8;i++){const t=a.currentTime+i*.07+Math.random()*.05,n=a.sampleRate*.06|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
    for(let j=0;j<n;j++)d[j]=(Math.random()*2-1)*(1-j/n);
    const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=1800;g.gain.value=.6;
    s.buffer=b;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t)}},
  win(){[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.2,.35,'triangle',.22));tone(1047,1.7,1,'triangle',.18);tone(1319,1.7,1,'triangle',.14);tone(1568,1.7,1,'triangle',.1)}};
const snd=n=>{try{SND[n]()}catch(e){}};
const R=new THREE.WebGLRenderer({canvas:$('cv'),antialias:true});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
let scene,cam,G=null,last=0;const pops=[];
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.5});
const fx=[],CG=new THREE.BoxGeometry(.25,.25,.05);
function confetti(col){
  const cs=['#ffd23f','#ff5d73','#4caf50','#00bbf9','#9b5de5'];
  for(let i=0;i<50;i++){
    const m=new THREE.Mesh(CG,new THREE.MeshBasicMaterial({color:i%2?col:cs[i%5]}));
    m.position.set(Math.random()*2-1,Math.random()*2-1,5);scene.add(m);
    fx.push({m,t:0,v:new THREE.Vector3(Math.random()*12-6,Math.random()*8+2,Math.random()*6-3)});
  }
}
function pop(o){o.scale.setScalar(.01);pops.push({o,t:0})}
function resize(){
  const w=innerWidth,h=innerHeight,a=w/h;R.setSize(w,h);
  if(!cam)return;
  cam.aspect=a;cam.fov=a<1?2*Math.atan(Math.tan(25*Math.PI/180)/a)*180/Math.PI:50;cam.updateProjectionMatrix();
}
addEventListener('resize',resize);
function openGame(g){
  G=g;pops.length=0;fx.length=0;scene=new THREE.Scene();scene.background=new THREE.Color(g.bg);
  scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,.95));
  const d=new THREE.DirectionalLight(0xffffff,.8);d.position.set(4,8,6);scene.add(d);
  cam=new THREE.PerspectiveCamera(50,1,.1,100);
  $('menu').hidden=true;$('pick').hidden=true;$('hud').hidden=false;$('pal').innerHTML='';say('');
  $('lvbtn').hidden=$('rsbtn').hidden=g.lv===undefined;
  g.init();resize();
}
function closeGame(){G=null;$('pick').hidden=true;$('hud').hidden=true;$('pal').innerHTML='';$('menu').hidden=false;showBest()}
$('back').onclick=closeGame;
let rsT=0;
$('rsbtn').onclick=()=>{const b=$('rsbtn');if(!G||G.lv===undefined)return;
  if(!rsT){b.textContent='Sure?';rsT=setTimeout(()=>{rsT=0;b.textContent='↺'},3000)}
  else{clearTimeout(rsT);rsT=0;b.textContent='↺';G.lv=0;G.done=[];saveLv();openGame(G)}};
$('lvbtn').onclick=()=>{
  if(!G||G.lv===undefined)return;
  const p=$('pick');p.innerHTML='<h2>Pick a level</h2><div class="lvgrid"></div>';const gd=p.querySelector('.lvgrid');
  for(let i=0;i<20;i++){const b=document.createElement('button');b.className='lvb'+(i===G.lv%20?' on':'')+(G.done.includes(i)?' done':'');b.innerHTML=(i+1)+(G.done.includes(i)?'<small>✓</small>':'');
    b.onclick=()=>{G.lv=i;saveLv();G.keep=false;openGame(G)};gd.append(b)}
  const c=document.createElement('button');c.className='opt';c.textContent='Close';c.onclick=()=>{p.hidden=true};p.append(c);p.hidden=false;
};
const fire=e=>{mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);G.click(ray)};
const ptr=new Map();let pd=null,pdist=0;
const dist=()=>{const [a,b]=[...ptr.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
$('cv').addEventListener('pointerdown',e=>{if(!G)return;if(!G.drag){fire(e);return}
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===2){pd=null;pdist=dist()}else if(ptr.size===1)pd={m:0}});
$('cv').addEventListener('pointermove',e=>{if(!G||!ptr.has(e.pointerId))return;
  const o=ptr.get(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===2){const d=dist();if(pdist)G.zoom(d/pdist);pdist=d;return}
  if(pd){const dx=e.clientX-o.x,dy=e.clientY-o.y;pd.m+=Math.abs(dx)+Math.abs(dy);G.drag(dx,dy)}});
const up=(e,tap)=>{if(tap&&pd&&G&&pd.m<10&&ptr.size===1)fire(e);ptr.delete(e.pointerId);pd=null;pdist=0};
$('cv').addEventListener('pointerup',e=>up(e,true));
$('cv').addEventListener('pointercancel',e=>up(e,false));
$('cv').addEventListener('wheel',e=>{if(G&&G.zoom){e.preventDefault();G.zoom(Math.exp(-e.deltaY*.001))}},{passive:false});

/* ---------- Game 1: Tic-Tac-Toe ---------- */
const TTT={bg:0xbfe3ff,mode:0,turn:0,
L:[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],
init(){
  this.k=(this.k||0)+1;this.b=Array(9).fill(0);this.over=false;this.wait=false;this.cells=[];this.turn=0;
  cam.position.set(0,8,6);cam.lookAt(0,0,0);
  this.grp=new THREE.Group();scene.add(this.grp);
  const base=new THREE.Mesh(new THREE.BoxGeometry(7.4,.5,7.4),mat(0x5c3d8f));base.position.y=-.4;this.grp.add(base);
  for(let i=0;i<9;i++){
    const c=new THREE.Mesh(new THREE.BoxGeometry(2,.3,2),mat((i%3+(i/3|0))%2?0xffe08a:0xfff3c4));
    c.position.set((i%3-1)*2.2,0,((i/3|0)-1)*2.2);c.userData.i=i;this.grp.add(c);this.cells.push(c);
  }
  if(this.keep&&this.mode){this.keep=false;this.begin()}else this.pickMode();
},
pickMode(){
  const ask=(t,o)=>{const p=$('pick');p.innerHTML='<h2>'+t+'</h2>';
    o.forEach(([n,f])=>{const b=document.createElement('button');b.className='opt';b.textContent=n;b.onclick=f;p.append(b)});p.hidden=false};
  const go=m=>()=>{this.mode=m;this.begin()};
  ask('Who do you want to play against?',[
    ['👫 A friend (pass the device)',go('f')],
    ['🤖 The robot',()=>ask('How good is the robot?',[['😀 Easy',go(1)],['😐 Medium',go(2)],['😈 Hard',go(3)],['← Back',()=>this.pickMode()]])]]);
},
begin(){$('pick').hidden=true;this.turn=1;say(this.mode==='f'?'❌ X goes first. Pass the device after each turn!':'Your turn! You are ❌')},
zoom(f){const g=this.grp;g.scale.setScalar(Math.max(.5,Math.min(2.6,g.scale.x*f)))},
drag(dx,dy){const g=this.grp;g.rotation.y+=dx*.01;g.rotation.x=Math.max(-.5,Math.min(.6,g.rotation.x+dy*.01))},
click(r){
  if(this.over){this.keep=true;openGame(this);return}
  if(this.wait||!this.turn)return;
  const h=r.intersectObjects(this.cells)[0];
  if(!h||this.b[h.object.userData.i])return;
  this.place(h.object.userData.i,this.turn);
},
win(b){for(const l of this.L)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])return b[l[0]];return 0},
place(i,p){
  const b=this.b;b[i]=p;let m;
  if(p===1){m=new THREE.Group();[1,-1].forEach(s=>{const a=new THREE.Mesh(new THREE.BoxGeometry(1.7,.35,.4),mat(0xe63946));a.rotation.y=s*Math.PI/4;m.add(a)})}
  else{m=new THREE.Mesh(new THREE.TorusGeometry(.65,.2,12,32),mat(0x1d7be0));m.rotation.x=Math.PI/2}
  m.position.set(this.cells[i].position.x,.5,this.cells[i].position.z);this.grp.add(m);pop(m);snd('pop');
  const f=this.mode==='f';
  if(this.win(b)===p){this.over=true;say((f?(p===1?'❌ X wins!':'⭕ O wins!'):(p===1?'You win!':'The robot wins! 🤖'))+' 🎉 Tap to play again');return}
  if(b.every(v=>v)){this.over=true;say("It's a draw! 🤝 Tap to play again");return}
  if(f){this.turn=3-p;say(this.turn===1?'❌ X turn. Pass the device!':'⭕ O turn. Pass the device!');return}
  if(p===1){
    this.wait=true;say('Robot is thinking…');const k=this.k;
    setTimeout(()=>{if(G===this&&this.k===k&&!this.over){this.ai();this.wait=false;if(!this.over)say('Your turn! ❌')}},550);
  }
},
mm(b,p){
  const w=this.win(b);if(w===2)return 1;if(w===1)return -1;if(b.every(v=>v))return 0;
  let best=p===2?-2:2;
  for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=this.mm(b,3-p);b[i]=0;best=p===2?Math.max(best,s):Math.min(best,s)}
  return best;
},
ai(){
  const b=this.b,e=b.map((v,i)=>v?-1:i).filter(i=>i>=0),rnd=a=>a[Math.random()*a.length|0];let m;
  if(this.mode===3){let best=-2,bm=[];for(const i of e){b[i]=2;const s=this.mm(b,1);b[i]=0;if(s>best){best=s;bm=[i]}else if(s===best)bm.push(i)}m=rnd(bm)}
  else{
    const f=p=>{for(const l of this.L){const v=l.map(i=>b[i]);if(v.filter(x=>x===p).length===2&&v.includes(0))return l[v.indexOf(0)]}};
    if(this.mode===2){m=f(2);if(m===undefined)m=f(1);if(m===undefined&&!b[4])m=4}
    if(m===undefined)m=rnd(e);
  }
  this.place(m,2);
}};

/* ---------- Game 2: Target Shooter ---------- */
const SH={bg:0x9ad1ff,lv:0,
init(){
  const n=this.lv,view=this.done.includes(this.lv%20)&&!this.replay;this.replay=false;
  this.need=Math.min(24,15+(n>>1));this.t=Math.max(16,20-(n>>2));this.sz=Math.max(.65,1-.025*n);this.spd=1+.07*n;
  this.life=Math.max(1.6,2.4-.04*n);this.max=Math.min(6,4+(n>>3));this.gap=Math.max(.4,.7-.015*n);
  cam.position.set(0,1.6,6);cam.lookAt(0,2.4,-10);
  const f=new THREE.Mesh(new THREE.PlaneGeometry(80,80),mat(0x5dbb63));f.rotation.x=-Math.PI/2;scene.add(f);
  this.ts=[];this.s=0;this.over=false;this.won=false;this.sp=0;this.tt=0;
  if(view){
    this.over=this.won=true;this.s=this.need;
    const T=new THREE.Group(),gold=mat(0xffc400);
    [[new THREE.CylinderGeometry(1.2,.6,1.6,24),0],[new THREE.CylinderGeometry(.18,.18,1,12),-1.3],[new THREE.BoxGeometry(1.6,.3,1.6),-1.95]].forEach(([g,y])=>{const m=new THREE.Mesh(g,gold);m.position.y=y;T.add(m)});
    T.position.set(0,3.3,-6);scene.add(T);this.tro=T;say('Level '+(n+1)+' is cleared ✓ Tap to play it again!');
  }else this.tro=null;
},
spawn(){
  const g=new THREE.Group(),hi=this.lv>=2,y=(hi?2.2:1.2)+Math.random()*(hi?2.8:3.8),z=this.sz;
  [[1,0xe63946,.15],[.68,0xffffff,.2],[.34,0xe63946,.25]].forEach(([r,c,h])=>{
    const m=new THREE.Mesh(new THREE.CylinderGeometry(r*z,r*z,h,28),mat(c));m.rotation.x=Math.PI/2;g.add(m)});
  g.position.set(Math.random()*12-6,y,-10);
  g.userData={tg:1,v:(Math.random()<.5?-1:1)*(1+Math.random()*1.5)*this.spd,life:this.life,y0:y,f:1+Math.random()*2,ph:Math.random()*6};
  scene.add(g);pop(g);this.ts.push(g);
},
click(r){
  if(this.over){this.replay=true;openGame(this);return}
  const h=r.intersectObjects(this.ts,true)[0];if(!h)return;
  let o=h.object;while(!o.userData.tg)o=o.parent;
  if(o.userData.hit)return;o.userData.hit=1;this.s++;snd('hit');
  if(this.s>=this.need){this.over=this.won=true;this.ts.forEach(x=>scene.remove(x));this.ts=[];this.last=this.lv>=19;say(this.last?'You beat every level! 🏆 Tap to play again':'Level '+(this.lv+1)+' cleared! 🎉 Tap for the next level');levelDone(this,this.last)}
},
update(dt){
  if(this.tro)this.tro.rotation.y+=dt*1.5;
  if(this.over)return;
  this.t-=dt;this.tt+=dt;
  if(this.t<=0){this.over=true;this.ts.forEach(o=>scene.remove(o));this.ts=[];say("Time's up! You hit "+this.s+' of '+this.need+'. Tap to try again');return}
  this.sp-=dt;if(this.sp<=0&&this.ts.length<this.max){this.spawn();this.sp=this.gap}
  for(const o of this.ts){const u=o.userData;
    if(u.hit){o.scale.multiplyScalar(1-dt*6);o.rotation.z+=dt*12}
    else{o.position.x+=u.v*dt;if(Math.abs(o.position.x)>6.5)u.v*=-1;if(this.lv>=2)o.position.y=u.y0+Math.sin(this.tt*u.f+u.ph)*1.1;u.life-=dt;if(u.life<=0)u.hit=2}
  }
  this.ts=this.ts.filter(o=>{if(o.userData.hit&&o.scale.x<.05){scene.remove(o);return false}return true});
  say('Level '+(this.lv+1)+'   🎯 '+this.s+'/'+this.need+'   ⏱ '+Math.ceil(this.t));
}};

/* ---------- Game 3: Colour by Number ---------- */
const LVS=[
{p:['.11..11.','12211111','12111111','11111113','.111113.','..1113..','...13...'],c:['','#e63946','#ffb3c1','#9d0208']},
{p:['..11111..','.1121121.','112111211','111111111','..33333..','..34343..','..33333..','.3333333.'],c:['','#e63946','#ffffff','#ffd6a5','#2b2250']},
{p:['...1111...','..122221..','.12333321.','1234444321','1234554321','1234..4321','123....321','12......21','1........1'],c:['','#e63946','#fb8500','#ffd23f','#4caf50','#1d7be0']},

function win4(b,p){
  for(let r=0;r<6;r++)for(let c=0;c<7;c++){if(b[r][c]!==p)continue;
    for(const[dx,dy]of[[1,0],[0,1],[1,1],[1,-1]]){const cells=[[r,c]];
      for(let k=1;k<4;k++){const y=r+dy*k,x=c+dx*k;if(y<0||y>=6||x<0||x>=7||b[y][x]!==p)break;cells.push([y,x])}
      if(cells.length===4)return cells}}
  return null;
}
function ev4(b){
  let s=0;for(let r=0;r<6;r++)if(b[r][3]===2)s+=3;
  for(let r=0;r<6;r++)for(let c=0;c<7;c++)for(const[dx,dy]of[[1,0],[0,1],[1,1],[1,-1]]){
    let a=0,h=0,e=0,ok=true;
    for(let k=0;k<4;k++){const y=r+dy*k,x=c+dx*k;if(y<0||y>=6||x<0||x>=7){ok=false;break}const v=b[y][x];if(v===2)a++;else if(v===1)h++;else e++}
    if(!ok)continue;if(a===3&&e===1)s+=5;else if(a===2&&e===2)s+=2;if(h===3&&e===1)s-=6;
  }
  return s;
}
function mm4(b,d,al,be,mx){
  if(win4(b,2))return 1e5+d;if(win4(b,1))return -1e5-d;
  const cols=[3,2,4,1,5,0,6].filter(c=>!b[5][c]);
  if(!d||!cols.length)return ev4(b);
  let best=mx?-1e9:1e9;

    if(mx){best=Math.max(best,v);al=Math.max(al,v)}else{best=Math.min(best,v);be=Math.min(be,v)}
    if(al>=be)break}
  return best;
}

  this.dist+=s*dt;if(this.dist>=this.gap){this.dist=0;this.gap=s*(.95+Math.random()*.9);this.spawn()}
  for(let i=this.ob.length-1;i>=0;i--){
    const o=this.ob[i];o.m.position.x-=s*dt;
    if(Math.abs(o.m.position.x+3.5)<o.w/2+.3&&this.py<o.h-.05){
      this.over=true;snd('bad');const k=this.k;setTimeout(()=>{if(G===this&&this.k===k)gameOver(this,this.score,'run','🏃')},600);return;
    }
    if(!o.c&&o.m.position.x<-4.3){o.c=true;this.score++;snd('pop');this.hud()}
    if(o.m.position.x<-9){scene.remove(o.m);this.ob.splice(i,1)}
  }
}};

SDK.snap=function(){return{v:this.v.map(r=>r.slice()),g:this.g.slice()}};
PET.snap=function(){return{reg:this.reg,st:this.st.map(v=>v===2?2:0)}};
MEM.snap=function(){return{deck:this.cards.map(c=>c.userData.e)}};
SH.snap=function(){return{ok:1}};
C4G.snap=function(){return{b:this.b.map(r=>r.slice())}};
const SAVE=[['sh',SH],['cb',CBN],['sd',SDK],['pt',PET],['mm',MEM],['c4',C4G]];
function saveLv(){try{localStorage.setItem('arcadeLv',JSON.stringify(Object.fromEntries(SAVE.map(([k,g])=>[k,{l:g.lv,d:g.done,s:g.snaps}]))))}catch(e){}}
try{const sv=JSON.parse(localStorage.getItem('arcadeLv'));if(sv)SAVE.forEach(([k,g])=>{const v=sv[k];if(v==null)return;if(typeof v==='number')g.lv=Math.min(v|0,19);else{g.lv=Math.min(v.l|0,19);g.done=Array.isArray(v.d)?v.d:[];g.snaps=v.s||{}}})}catch(e){}
SAVE.forEach(([k,g])=>{g.done=g.done||[];g.snaps=g.snaps||{}});
function levelDone(g,last){if(!g.done.includes(g.lv))g.done.push(g.lv);if(g.snap)g.snaps[g.lv%20]=g.snap();g.lv=last?0:g.lv+1;saveLv();snd('win')}
[['❌⭕','Tic-Tac-Toe','Get three in a row to win',TTT],['🎯','Shooting Game','Tap the targets before time runs out',SH],['🎨','Colour by Number','Colour in the picture using the numbers',CBN],['🔢','Sudoku','Fill the grid so no number repeats',SDK],['🐱','Petdoku',"Put one cat in every colour. But the cats can't touch, and they can't be in the same row",PET],['🃏','Memory Match','Flip cards and find the matching pairs',MEM],['🔴','Four in a Row','Drop discs and get four in a row before the robot does',C4G],['🏗️','Stack Tower','Stack blocks as high as you can!',STK,''],['🐍','Snake','Eat apples and grow without crashing',SNK,'snake'],['🏃','Jump Runner','Tap to jump over the blocks',RUN,'run']].forEach(([e,n,d,g,k])=>{
  const b=document.createElement('button');b.className='card';
  b.innerHTML='<div class="e">'+e+'</div>'+n+'<small>'+d+'</small>';
  if(k!==undefined){b.dataset.k=k;const bs=document.createElement('small');bs.className='bst';b.append(bs)}
  b.onclick=()=>{g.keep=false;openGame(g)};$('cards').append(b);
});
const showBest=()=>document.querySelectorAll('#cards button[data-k]').forEach(b=>{const v=HI.get(b.dataset.k)[0];b.querySelector('.bst').textContent=v?'🏆 Best: '+v:''});
showBest();

function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,Math.max(0,t-last)/1000);last=t;
  if(!G)return;
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt*5;const k=Math.min(1,p.t);p.o.scale.setScalar(Math.max(.01,k*(2-k)));if(k>=1)pops.splice(i,1)}
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;f.v.y-=12*dt;f.m.position.addScaledVector(f.v,dt);f.m.rotation.x+=dt*9;f.m.rotation.y+=dt*7;
    if(f.t>1.6){scene.remove(f.m);fx.splice(i,1)}else if(f.t>1.1)f.m.scale.setScalar((1.6-f.t)*2)}
  if(G.lv!==undefined){const tx='Level '+(G.lv%20+1)+(G.done.includes(G.lv%20)?' ✓':'')+' ▾';if($('lvbtn').textContent!==tx)$('lvbtn').textContent=tx}
  if(G.update)G.update(dt,t/1000);
  R.render(scene,cam);
}
requestAnimationFrame(loop);
}
if(typeof THREE==='undefined'){$('cards').textContent='Could not load 3D. Check your internet and refresh the page.'}
else{try{main()}catch(e){$('cards').textContent='3D does not work on this device: '+e.message}}
</script>
